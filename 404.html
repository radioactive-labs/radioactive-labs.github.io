<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Radioactive Labs</title>
<meta name="description" content="That page does not exist on radioactive-labs.github.io.">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#f6f3ec">
<style>
  :root{
    --paper:#f6f3ec;
    --paper-2:#efeade;
    --ink:#161412;
    --body:#57524a;
    --faint:#8a847a;
    --line:#e2dccf;
    --accent:#c9f23c;
    --accent-ink:#141210;
    --accent-deep:#5a7000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;
    font-size:17px;
    line-height:1.55;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 40px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  a{color:inherit}

  nav{border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;
    letter-spacing:-.01em;text-transform:uppercase}
  .mark{width:13px;height:13px;border-radius:50%;background:var(--accent);display:inline-block}
  .nav-links{display:flex;gap:28px;font-size:14px;color:var(--body);font-weight:500}
  .nav-links a{text-decoration:none}
  .nav-links a:hover{color:var(--ink)}

  .hero{padding:110px 0 84px}
  h1{font-weight:700;font-size:66px;line-height:0.98;letter-spacing:-.035em;max-width:15ch}
  .lede{margin-top:34px;max-width:52ch;font-size:19px;color:var(--body)}
  .cta-row{margin-top:40px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);
    text-decoration:none;font-weight:700;font-size:15px;padding:15px 28px;letter-spacing:-.01em}
  .btn:hover{background:#d4fa54}
  .btn-note{font-size:14px;color:var(--faint)}
  .copy{font-family:inherit;font-size:14px;font-weight:600;color:var(--body);
    background:none;border:1px solid var(--line);padding:14px 18px;cursor:pointer;
    transition:border-color .15s ease,color .15s ease}
  .copy:hover{border-color:var(--accent-deep);color:var(--ink)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent-deep);outline-offset:3px}

  section.blk{padding:70px 0;border-top:1px solid var(--line)}
  h2{font-weight:700;font-size:34px;letter-spacing:-.025em;line-height:1.05}
  .blk p.intro{margin-top:18px;max-width:60ch;color:var(--body);font-size:18px}

  .how p{max-width:64ch;color:var(--body);font-size:18px}

  .build-grid{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:40px 60px}
  .build-item h3{font-weight:700;font-size:20px;letter-spacing:-.02em}
  .build-item p{margin-top:10px;color:var(--body);font-size:16px}

  .prod-grid{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .prod{border:1px solid var(--line);background:var(--paper-2);padding:30px}
  .prod .tag{font-size:11px;color:var(--accent-deep);font-weight:700;letter-spacing:.12em}
  .prod h3{font-weight:700;font-size:23px;letter-spacing:-.02em;margin-top:8px}
  .prod p{margin-top:11px;color:var(--body);font-size:15.5px}
  .prod .lnk{margin-top:18px;display:inline-block;font-size:14.5px;font-weight:600;
    text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .prod .lnk:hover{text-decoration-color:var(--ink)}
  .prod.ghost{background:transparent;border-style:dashed;display:flex;align-items:center}
  .prod.ghost p{margin:0;color:var(--faint)}

  .stack-list{margin-top:34px;display:grid}
  .stack-row{display:grid;grid-template-columns:180px 1fr;gap:24px;
    padding:16px 0;border-top:1px solid var(--line);align-items:baseline}
  .stack-row:first-child{border-top:none}
  .stack-row .name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14.5px;font-weight:600}
  .stack-row .name a{text-decoration:none}
  .stack-row .name a:hover{color:var(--accent-deep)}
  .stack-row .desc{color:var(--body);font-size:15.5px}
  .stack-row .desc a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .stack-row .desc a:hover{text-decoration-color:var(--ink)}

  .who p{max-width:60ch;font-size:19px;color:var(--body)}
  .who a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
  .who a:hover{text-decoration-color:var(--ink)}

  .contact{padding:88px 0}
  .contact h2{font-size:42px;letter-spacing:-.03em}
  .contact p{margin-top:18px;max-width:52ch;color:var(--body);font-size:18px}

  footer{border-top:1px solid var(--line);padding:34px 0 60px}
  .foot-in{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;
    font-size:14px;color:var(--body)}
  .foot-in a{text-decoration:none}
  .foot-in a:hover{color:var(--ink)}

  @media(max-width:720px){
    .wrap{padding:0 24px}
    h1{font-size:42px;letter-spacing:-.03em}
    .lede{font-size:17px}
    .build-grid,.prod-grid{grid-template-columns:1fr}
    .stack-row{grid-template-columns:1fr;gap:4px}
    .nav-links{display:none}
    .contact h2{font-size:32px}
  }

  .nf{padding:120px 0 140px}
  .nf h1{font-size:42px;line-height:1.05;letter-spacing:-.03em;max-width:none}
  .nf p{margin-top:20px;max-width:52ch;color:var(--body);font-size:18px}
  .nf a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .nf a:hover{text-decoration-color:var(--accent-deep)}
</style>
</head>
<body>

<nav><div class="wrap nav-in">
  <div class="brand"><span class="mark"></span>Radioactive Labs</div>
  <div class="nav-links">
    <a href="#build">What we build</a>
    <a href="#products">Products</a>
    <a href="#stack">The stack</a>
    <a href="#contact">Contact</a>
  </div>
</div></nav>

<section class="nf"><div class="wrap">
  <h1>That page does not exist.</h1>
  <p>The link may be out of date. Everything here is reachable from the <a href="/">home page</a>, or the source is on <a href="https://github.com/radioactive-labs">GitHub</a>.</p>
</div></section>

<footer><div class="wrap foot-in">
  <div>Radioactive Labs is operated by <a href="https://fayaworks.com/">Fayaworks Technologies Ltd</a>, Accra, Ghana.</div>
  <div><a href="https://github.com/radioactive-labs">github.com/radioactive-labs</a></div>
</div></footer>

</body>
</html>
